<!DOCTYPE html>
<html>
<head><title>Academic Firewall</title><style>
body{background:#0a0e1a;color:#fff;font-family:Arial;padding:20px}
.container{max-width:1200px;margin:0 auto}
h1{color:#ffa500}
.card{background:#1a2332;border-radius:10px;padding:15px;margin:10px;cursor:pointer;display:inline-block;width:200px}
.card:hover{background:#ffa500;color:#000}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000}
.modal-content{background:#1a2332;margin:10% auto;padding:20px;width:500px;border-radius:10px}
.close{float:right;cursor:pointer;color:#ffa500}
</style>
</head>
<body>
<div class="container">
<h1>🏛️ Academic Institution Firewall</h1>
<div class="card" onclick="showDetail('vlan')">📚 VLAN Configuration</div>
<div class="card" onclick="showDetail('nat')">🌐 NAT</div>
<div class="card" onclick="showDetail('vpn')">🔒 VPN (WireGuard)</div>
<div class="card" onclick="showDetail('ids')">🛡️ IDS/IPS</div>
<div class="card" onclick="showDetail('qos')">📊 QoS</div>
<div class="card" onclick="showDetail('ha')">🔄 High Availability</div>
</div>
<div id="modal" class="modal"><div class="modal-content"><span class="close" onclick="closeModal()">&times;</span><div id="modalBody"></div></div></div>
<script>
function showDetail(comp){
var details={vlan:"<h2>VLAN Configuration</h2><p>VLAN10: Academic 10.10.10.0/24<br>VLAN20: Admin 10.10.20.0/24<br>VLAN30: Research 10.10.30.0/24<br>VLAN40: Guest 10.10.40.0/24<br>VLAN99: DMZ 172.16.0.0/24</p>",nat:"<h2>NAT Configuration</h2><p>iptables -t nat -A POSTROUTING -s 10.10.0.0/16 -o eth0 -j MASQUERADE</p>",vpn:"<h2>WireGuard VPN</h2><p>ListenPort:51820<br>Address:10.100.0.1/24</p>",ids:"<h2>Snort IDS/IPS</h2><p>snort -Q -c /etc/snort/snort.conf</p>",qos:"<h2>QoS Traffic Shaping</h2><p>Guest limited to 10Mbps</p>",ha:"<h2>High Availability</h2><p>CARP Virtual IP:10.10.1.1</p>"};
document.getElementById('modalBody').innerHTML=details[comp];document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';}
</script>
</body>
</html>
